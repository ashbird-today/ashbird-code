name: Bug report
description: Something in Ashbird Code does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Ask the agent to ...\n3. See ..."
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "0.1.45"
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options: [VS Code, Cursor, Windsurf, VSCodium, Other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "From the Output panel, channel 'Ashbird'. Remove any code, keys or paths you don't want to share."
      render: text
